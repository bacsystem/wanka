openapi: 3.1.0
info:
  title: Wanka API (plano tenant)
  version: 0.1.0-draft
  description: |
    Esqueleto de partida. Fija convenciones (errores, paginación, dinero,
    idempotencia) y dos endpoints de referencia. La fuente de verdad final
    vivirá en apps/api/openapi/openapi.yaml (ADR 0009).
servers:
  - url: http://api.railway.internal:8080
    description: Red privada (solo el BFF de Next.js)
security:
  - tenantSession: []
tags:
  - name: ventas
    description: POS y proformas
  - name: facturacion-electronica
    description: CPE, notas, bajas y guías vía InvoicingProvider
paths:
  /v1/sales:
    post:
      tags: [ventas]
      operationId: createSale
      summary: Registra una venta POS y encola la emisión del CPE
      description: |
        Rol: cualquiera con permiso ventas.pos:create y turno de caja abierto
        en la sede de la sesión. Descuenta stock, asigna serie y número y
        crea el CPE en estado pendiente en una sola transacción.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSaleRequest' }
      responses:
        '201':
          description: Venta registrada; CPE pendiente de emisión
          headers:
            Idempotent-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleCreated' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/einvoicing/documents:
    get:
      tags: [facturacion-electronica]
      operationId: listDocuments
      summary: Lista comprobantes del tenant de la sesión
      parameters:
        - { name: type, in: query, schema: { type: array, items: { $ref: '#/components/schemas/DocumentType' } }, explode: true }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/CpeStatus' } }, explode: true }
        - { name: issuedFrom, in: query, schema: { type: string, format: date } }
        - { name: issuedTo, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de comprobantes, más recientes primero
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SalesDocument' } }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    tenantSession:
      type: http
      scheme: bearer
      description: Token opaco con prefijo wk_at_. Los tokens wka_ (plataforma) se rechazan.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Money:
      type: string
      pattern: '^-?\d{1,12}\.\d{2}$'
      examples: ['118.00']
    UnitPrice:
      type: string
      pattern: '^\d{1,10}(\.\d{1,4})?$'
    Quantity:
      type: string
      pattern: '^\d{1,10}(\.\d{1,4})?$'
    Currency:
      type: string
      enum: [PEN, USD]
    DocumentType:
      type: string
      description: Abierto; los clientes deben tolerar valores nuevos.
      enum: [boleta, factura, nota_credito, nota_debito, guia_remision]
    CpeStatus:
      type: string
      enum: [pendiente, enviado, aceptado, observado, rechazado, anulado]
    PaymentMethod:
      type: string
      enum: [efectivo, tarjeta, yape_plin, transferencia, credito]
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, examples: [insufficient_stock] }
        detail: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              meta: { type: object, additionalProperties: true }
    CreateSaleRequest:
      type: object
      required: [documentType, lines, payments, expectedTotal]
      properties:
        documentType: { type: string, enum: [boleta, factura] }
        customerId:
          type: [string, 'null']
          format: uuid
          description: Obligatorio para factura; null = cliente varios (boleta en soles hasta S/ 700.00, límite de Khipu).
        quoteId: { type: [string, 'null'], format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [variantId, quantity, unitPrice]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { $ref: '#/components/schemas/Quantity' }
              unitPrice: { $ref: '#/components/schemas/UnitPrice' }
              discount: { $ref: '#/components/schemas/Money' }
        payments:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [method, amount]
            properties:
              method: { $ref: '#/components/schemas/PaymentMethod' }
              amount: { $ref: '#/components/schemas/Money' }
              reference: { type: string, maxLength: 64 }
        expectedTotal:
          $ref: '#/components/schemas/Money'
    SaleCreated:
      type: object
      required: [saleId, total, document]
      properties:
        saleId: { type: string, format: uuid }
        total: { $ref: '#/components/schemas/Money' }
        change: { $ref: '#/components/schemas/Money' }
        document: { $ref: '#/components/schemas/SalesDocument' }
    SalesDocument:
      type: object
      description: Forma de types/domain.ts SalesDocument con importes como string.
      required: [id, type, series, number, customerName, customerDocument, total, currency, sunatStatus, issuedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DocumentType' }
        series: { type: string, pattern: '^[A-Z0-9]{4}$' }
        number: { type: integer, minimum: 1, maximum: 99999999 }
        customerName: { type: string }
        customerDocument: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        sunatStatus: { $ref: '#/components/schemas/CpeStatus' }
        issuedAt: { type: string, format: date-time }
