openapi: 3.1.0
info:
  title: Wanka API (plano tenant)
  version: 0.1.0-draft
  description: |
    Esqueleto de partida. Fija convenciones (errores, paginación, dinero,
    idempotencia) y dos endpoints de referencia. La fuente de verdad final
    vivirá en apps/api/openapi/openapi.yaml (ADR 0009).
servers:
  - url: http://api.railway.internal:8080
    description: Red privada (solo el BFF de Next.js)
security:
  - tenantSession: []
tags:
  - name: ventas
    description: POS y proformas
  - name: facturacion-electronica
    description: CPE, notas, bajas y guías vía InvoicingProvider
paths:
  /v1/sales:
    post:
      tags: [ventas]
      operationId: createSale
      x-module: ventas
      x-permission: ventas.pos:create
      summary: Registra una venta POS y encola la emisión del CPE
      description: |
        Rol: cualquiera con permiso ventas.pos:create y turno de caja abierto
        en la sede de la sesión. Descuenta stock, asigna serie y número y
        crea el CPE en estado pendiente en una sola transacción.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSaleRequest' }
      responses:
        '201':
          description: Venta registrada; CPE pendiente de emisión
          headers:
            Idempotent-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleCreated' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/einvoicing/documents:
    get:
      tags: [facturacion-electronica]
      operationId: listDocuments
      x-module: facturacion-electronica
      x-permission: facturacion.cpe:read
      summary: Lista comprobantes del tenant de la sesión
      parameters:
        - { name: type, in: query, schema: { type: array, items: { $ref: '#/components/schemas/DocumentType' } }, explode: true }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/CpeStatus' } }, explode: true }
        - { name: issuedFrom, in: query, schema: { type: string, format: date } }
        - { name: issuedTo, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de comprobantes, más recientes primero
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SalesDocument' } }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    tenantSession:
      type: http
      scheme: bearer
      description: Token opaco con prefijo wk_at_. Los tokens wka_ (plataforma) se rechazan.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    MoneyPositive:
      type: string
      description: Importe mayor que cero (CHECK amount > 0 / total > 0 en la base). Sin lookahead, porque Go (RE2) no lo soporta; cada patrón se compila con regexp en CI.
      pattern: '^(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,11}\.[0-9]{2})$'
      examples: ['118.00']
    MoneyNonNegative:
      type: string
      description: Importe mayor o igual que cero (descuentos; CHECK >= 0).
      pattern: '^[0-9]{1,12}\.[0-9]{2}$'
      examples: ['0.00']
    UnitPrice:
      type: string
      description: Precio unitario con IGV, mayor que cero (Khipu y SUNAT rechazan precio cero o negativo).
      pattern: '^([1-9][0-9]{0,9}(\.[0-9]{1,4})?|0\.([1-9][0-9]{0,3}|0[1-9][0-9]{0,2}|00[1-9][0-9]?|000[1-9]))$'
    Quantity:
      type: string
      description: Cantidad mayor que cero.
      pattern: '^([1-9][0-9]{0,9}(\.[0-9]{1,4})?|0\.([1-9][0-9]{0,3}|0[1-9][0-9]{0,2}|00[1-9][0-9]?|000[1-9]))$'
    ExchangeRate:
      type: string
      description: Soles por USD con exactamente 3 decimales, hasta 3 enteros (igual que tipo_cambio de Khipu). Obligatorio si currency = USD y prohibido si PEN.
      pattern: '^[0-9]{1,3}\.[0-9]{3}$'
      examples: ['3.756']
    Currency:
      type: string
      enum: [PEN, USD]
    DocumentType:
      type: string
      description: Abierto; los clientes deben tolerar valores nuevos.
      enum: [boleta, factura, nota_credito, nota_debito, guia_remision]
    CpeStatus:
      type: string
      enum: [pendiente, enviado, aceptado, observado, rechazado, anulado]
    PaymentMethod:
      type: string
      description: credito solo en factura (Khipu emite la boleta al contado).
      enum: [efectivo, tarjeta, yape, plin, transferencia, credito]
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        total:
          type: integer
          minimum: 0
          description: Solo si el endpoint lo declara y la petición trae includeTotal=true (conventions.md §5).
        totalIsEstimate:
          type: boolean
          description: Presente junto con total; true si es una estimación o un conteo con tope.
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Uno de la lista cerrada de conventions.md §4; un valor desconocido se trata por status y title.
          examples: [insufficient_stock]
        detail: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              meta: { type: object, additionalProperties: true }
    CreateSaleRequest:
      type: object
      description: |
        La caja y la sede salen de la sesión; shiftId debe ser el turno abierto de esa caja
        (409 shift_not_open si no). La serie se toma de (caja, documentType).
      required: [shiftId, documentType, currency, lines, payments, expectedTotal]
      properties:
        shiftId: { type: string, format: uuid }
        documentType: { type: string, enum: [boleta, factura] }
        currency: { $ref: '#/components/schemas/Currency' }
        exchangeRate:
          description: Obligatorio si currency = USD (422 exchange_rate_required); prohibido si PEN.
          oneOf:
            - $ref: '#/components/schemas/ExchangeRate'
            - type: 'null'
        customerId:
          type: [string, 'null']
          format: uuid
          description: Obligatorio para factura. null = cliente varios (boleta en soles hasta S/ 700.00, límite de Khipu).
        quoteId: { type: [string, 'null'], format: uuid }
        discountApprovalToken:
          type: [string, 'null']
          description: Token de re-autenticación del supervisor si algún descuento supera el tope del rol (ventas.discounts:approve).
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [variantId, quantity, unitPrice]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { $ref: '#/components/schemas/Quantity' }
              unitPrice: { $ref: '#/components/schemas/UnitPrice' }
              discount: { $ref: '#/components/schemas/MoneyNonNegative' }
              discountReason: { type: string, maxLength: 200, description: Obligatorio si discount > 0. }
        payments:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [method, currency, amount]
            properties:
              method: { $ref: '#/components/schemas/PaymentMethod' }
              currency: { $ref: '#/components/schemas/Currency' }
              amount: { $ref: '#/components/schemas/MoneyPositive' }
              exchangeRate:
                description: Obligatorio si la moneda del pago difiere de la de la venta.
                oneOf:
                  - $ref: '#/components/schemas/ExchangeRate'
                  - type: 'null'
              reference: { type: string, maxLength: 64 }
        expectedTotal:
          $ref: '#/components/schemas/MoneyPositive'
    SaleCreated:
      type: object
      required: [saleId, total, currency, change, document]
      properties:
        saleId: { type: string, format: uuid }
        total: { $ref: '#/components/schemas/MoneyPositive' }
        currency: { $ref: '#/components/schemas/Currency' }
        change: { $ref: '#/components/schemas/MoneyNonNegative' }
        document: { $ref: '#/components/schemas/SalesDocument' }
    SalesDocument:
      type: object
      description: Forma de SalesDocument de types/domain.ts, con importes como string. number es null en una GRE hasta que Khipu la numera.
      required: [id, type, series, number, customerName, customerDocument, total, currency, sunatStatus, issuedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DocumentType' }
        series: { type: string, pattern: '^[A-Z0-9]{4}$' }
        number: { type: [integer, 'null'], minimum: 1, maximum: 99999999 }
        display: { type: [string, 'null'], examples: ['F001-00000842'] }
        customerName: { type: string }
        customerDocument: { type: string }
        total: { $ref: '#/components/schemas/MoneyNonNegative' }
        currency: { $ref: '#/components/schemas/Currency' }
        exchangeRate:
          oneOf:
            - $ref: '#/components/schemas/ExchangeRate'
            - type: 'null'
        sunatStatus: { $ref: '#/components/schemas/CpeStatus' }
        issuedAt: { type: string, format: date-time }
