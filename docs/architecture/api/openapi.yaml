openapi: 3.1.0
info:
  title: Wanka API (plano tenant)
  version: 0.1.0-draft
  description: |
    Esqueleto de partida. Fija convenciones (errores, paginación, dinero,
    idempotencia) y dos endpoints de referencia. La fuente de verdad final
    vivirá en apps/api/openapi/openapi.yaml (ADR 0009).
servers:
  - url: http://api.railway.internal:8080
    description: Red privada (solo el BFF de Next.js)
security:
  - tenantSession: []
tags:
  - name: identidad
    description: Login, 2FA y sesión (rutas /v1/auth/*)
  - name: ventas
    description: POS y proformas
  - name: facturacion-electronica
    description: CPE, notas, bajas y guías vía InvoicingProvider
  - name: identidad
    description: Sesión, usuario y entitlements de la empresa
paths:
  /v1/auth/mfa/enrollment/totp:
    post:
      tags: [identidad]
      operationId: startMfaEnrollment
      security: []
      summary: Entrega el secreto TOTP pendiente del enrolamiento obligatorio del login
      description: |
        Clase Public (conventions.md §2): sin sesión, con el enrollmentToken en el cuerpo y nunca como
        Bearer. Lo llama el BFF después de que POST /v1/auth/login respondió MfaEnrollmentRequired.
        Sin efectos visibles: con el mismo token vigente devuelve siempre el mismo secreto (no lo rota)
        y no manda correo (el emailCode sale en el login). Orden de comprobación (conventions.md §2):
        esquema (400/422), token vencido, consumido o inexistente (401 session_expired, #187),
        segundo paso bloqueado (429 rate_limited con Retry-After). Un token
        consumido por el bloqueo da 401. Idempotency-Key no se acepta en /v1/auth/*: 400
        malformed_request (conventions.md §3).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollmentTokenRequest' }
      responses:
        '200':
          description: Secreto pendiente; se confirma con /v1/auth/mfa/enrollment/totp/confirm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaTotpSecret' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/auth/mfa/enrollment/totp/confirm:
    post:
      tags: [identidad]
      operationId: confirmMfaEnrollment
      security: []
      summary: Activa la 2FA con el primer código TOTP y el emailCode, y crea la sesión
      description: |
        Clase Public. Exige el código TOTP del autenticador recién configurado y el emailCode que el
        login mandó al correo del usuario (decisión del dueño, #25; reglas en conventions.md §2).
        - Los dos correctos: guarda el TOTP y los códigos de recuperación, crea la sesión con
          mfa_method = totp, consume el token y pone en 0 el contador de segundo paso. Responde 200.
        - Uno o los dos incorrectos: 422 validation_failed con un elemento de errors[] por campo
          incorrecto (field code o emailCode, code validation_failed, meta.attemptsRemaining). Cuenta un
          fallo en el contador del usuario, compartido con /v1/auth/mfa/verify; no consume el token.
        - 5.º fallo seguido: el segundo paso queda bloqueado 15 min, todos los tokens de paso vivos
          del usuario se consumen sin crear sesión y responde 429 rate_limited con Retry-After hasta
          el fin del bloqueo. Después, ese token da 401 (el token se comprueba antes que el bloqueo).
        - Cada bloqueo avisa por correo. El 3.er bloqueo desde el último restablecimiento de
          contraseña (un segundo paso correcto no los reinicia): el segundo paso queda cerrado hasta
          restablecer la contraseña, y el usuario recibe un aviso por correo (conventions.md §2).
        - Formato inválido (no son 6 dígitos): 422 validation_failed del esquema; no cuenta.
        - Sin el secreto pendiente (no se llamó /v1/auth/mfa/enrollment/totp con este token): 409
          invalid_state_transition; no cuenta.
        - Token vencido, consumido o inexistente: 401 session_expired (#187). El emailCode vence con
          el token (10 min desde el login).
        Idempotency-Key no se acepta en /v1/auth/*: 400 malformed_request sin ejecutar nada
        (conventions.md §3), porque el 422 y el 429 confirman el contador y el bloqueo.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollmentConfirmRequest' }
      responses:
        '200':
          description: 2FA activa y sesión creada, sin empresa elegida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollmentConfirmed' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/auth/mfa/enrollment/email-code/resend:
    post:
      tags: [identidad]
      operationId: resendMfaEnrollmentEmailCode
      security: []
      summary: Manda un emailCode nuevo al correo del usuario del enrollmentToken
      description: |
        Clase Public, con el enrollmentToken en el cuerpo. Genera un código nuevo (el anterior deja de
        valer) y lo manda por el Mailer después del COMMIT; no alarga el token. Topes (conventions.md
        §2): 3 envíos por token contando el del login, 60 s entre envíos, y por usuario 10 envíos por
        hora y 20 en 24 h. Orden de comprobación: esquema, token (vencido, consumido o inexistente:
        401 session_expired, #187), bloqueo vigente y topes (429 rate_limited con Retry-After). Si
        el Mailer falla o vence (5 s): 503 dependency_unavailable con Retry-After 60, y el envío
        cuenta. Idempotency-Key no se acepta en /v1/auth/*: 400 malformed_request.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollmentTokenRequest' }
      responses:
        '202':
          description: Código nuevo enviado al Mailer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEmailCodeResent' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/sales:
    post:
      tags: [ventas]
      operationId: createSale
      x-module: ventas
      x-permission: ventas.pos:create
      summary: Registra una venta POS y encola la emisión del CPE
      description: |
        Rol: cualquiera con permiso ventas.pos:create y turno de caja abierto
        en la sede de la sesión. Descuenta stock, asigna serie y número y
        crea el CPE en estado pendiente en una sola transacción.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSaleRequest' }
      responses:
        '201':
          description: Venta registrada; CPE pendiente de emisión
          headers:
            Idempotent-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleCreated' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/einvoicing/documents:
    get:
      tags: [facturacion-electronica]
      operationId: listDocuments
      x-module: facturacion-electronica
      x-permission: facturacion.cpe:read
      summary: Lista comprobantes del tenant de la sesión
      parameters:
        - { name: type, in: query, schema: { type: array, items: { $ref: '#/components/schemas/DocumentType' } }, explode: true }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/CpeStatus' } }, explode: true }
        - { name: issuedFrom, in: query, schema: { type: string, format: date } }
        - { name: issuedTo, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de comprobantes, más recientes primero
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SalesDocument' } }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/me/entitlements:
    get:
      tags: [identidad]
      operationId: getMyEntitlements
      x-module: none
      x-permission: none
      summary: Módulos, flags y límites habilitados para la empresa de la sesión
      description: |
        Lee `entitlements.For` (ADR 0005) para el tenant de la sesión, de la caché en memoria (TTL 30 s,
        invalidada por NOTIFY): nunca incluye datos de otra empresa. Pasa también con la suscripción
        inactiva (`status` morosa, suspendida o cancelada) o la empresa cerrada (`readOnly`), para que la UI
        muestre el motivo del bloqueo (conventions.md §4). Sin suscripción: `status` es `sin_plan` y las listas
        vienen vacías. La UI usa esto solo para ocultar menús; la API es la que aplica.
        `x-module: none` y `x-permission: none` (ADR 0009, «Cómo se declara ninguno»): solo pide una sesión
        ligada a una empresa, sin módulo ni permiso, porque quien no tiene plan o tiene la suscripción inactiva
        no tiene ningún módulo y aun así tiene que poder leer el motivo.
      responses:
        '200':
          description: Entitlements de la empresa de la sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    tenantSession:
      type: http
      scheme: bearer
      description: Token opaco con prefijo wk_at_. Los tokens wka_ (plataforma) se rechazan.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Se conserva si cumple el patrón; si falta o no lo cumple, la API lo reemplaza por uno propio y nunca responde 400 por esta cabecera (conventions.md §3).
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    EnrollmentToken:
      type: string
      description: Token de paso del enrolamiento (wk_en_ + 32 bytes en base64url sin relleno, conventions.md §2). TTL 10 min desde el login.
      pattern: '^wk_en_[A-Za-z0-9_-]{43}$'
    TotpCode:
      type: string
      description: Código TOTP de 6 dígitos (RFC 6238, 30 s, ventana ±1).
      pattern: '^[0-9]{6}$'
    EmailCode:
      type: string
      description: Código de un solo uso enviado al correo en el enrolamiento obligatorio. Vence con el enrollmentToken; en la base solo va su HMAC (conventions.md §2).
      pattern: '^[0-9]{6}$'
    MfaEnrollmentRequired:
      type: object
      description: |
        Variante del 200 de POST /v1/auth/login (forma completa del login: #24) cuando el usuario no
        tiene TOTP y algún rol de sus membresías lo exige. No trae tokens de acceso. emailCodeSent es
        false si el Mailer no respondió o no había cupo de envío: el token sirve igual y el usuario
        pide un reenvío (conventions.md §2). En vez de esta variante, el login responde 429
        rate_limited con el segundo paso bloqueado o los topes de correo superados (10 por hora, 20
        en 24 h), y 401 invalid_credentials con el segundo paso cerrado tras 3 bloqueos.
      required: [status, enrollmentToken, expiresAt, emailCodeSent]
      properties:
        status: { type: string, const: mfa_enrollment_required }
        enrollmentToken: { $ref: '#/components/schemas/EnrollmentToken' }
        expiresAt: { type: string, format: date-time, description: Vencimiento del token y del emailCode. }
        emailCodeSent: { type: boolean }
    MfaEnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required: [enrollmentToken]
      properties:
        enrollmentToken: { $ref: '#/components/schemas/EnrollmentToken' }
    MfaTotpSecret:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: 'Secreto TOTP en base32, para escribirlo a mano.' }
        otpauthUri: { type: string, description: 'URI otpauth://totp/... que el BFF convierte en QR.' }
    MfaEnrollmentConfirmRequest:
      type: object
      additionalProperties: false
      required: [enrollmentToken, code, emailCode]
      properties:
        enrollmentToken: { $ref: '#/components/schemas/EnrollmentToken' }
        code: { $ref: '#/components/schemas/TotpCode' }
        emailCode: { $ref: '#/components/schemas/EmailCode' }
    MfaEnrollmentConfirmed:
      type: object
      description: Misma sesión sin empresa que el login con 2FA (secuencia 01); el BFF pone las cookies y lleva a /seleccionar-empresa.
      required: [accessToken, refreshToken, expiresAt, recoveryCodes, memberships]
      properties:
        accessToken: { type: string, pattern: '^wk_at_[A-Za-z0-9_-]{43}$' }
        refreshToken: { type: string, pattern: '^wk_rt_[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time, description: Vencimiento del accessToken. }
        recoveryCodes:
          type: array
          description: Los 10 códigos de recuperación; se muestran esta única vez (ADR 0004).
          minItems: 10
          maxItems: 10
          items: { type: string }
        memberships:
          type: array
          description: Misma forma que GET /v1/me/memberships; se fija en #27.
          items: { type: object }
    MfaEmailCodeResent:
      type: object
      required: [resendAvailableAt, sendsRemaining]
      properties:
        resendAvailableAt: { type: string, format: date-time, description: Desde cuándo se puede pedir otro envío (60 s después de este). }
        sendsRemaining: { type: integer, minimum: 0, maximum: 2, description: Envíos que le quedan a este token. }
    MoneyPositive:
      type: string
      description: Importe mayor que cero (CHECK amount > 0 / total > 0 en la base). Sin lookahead, porque Go (RE2) no lo soporta; cada patrón se compila con regexp en CI.
      pattern: '^(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,11}\.[0-9]{2})$'
      examples: ['118.00']
    MoneyNonNegative:
      type: string
      description: Importe mayor o igual que cero (descuentos; CHECK >= 0).
      pattern: '^[0-9]{1,12}\.[0-9]{2}$'
      examples: ['0.00']
    UnitPrice:
      type: string
      description: Precio unitario con IGV, mayor que cero (Khipu y SUNAT rechazan precio cero o negativo).
      pattern: '^([1-9][0-9]{0,9}(\.[0-9]{1,4})?|0\.([1-9][0-9]{0,3}|0[1-9][0-9]{0,2}|00[1-9][0-9]?|000[1-9]))$'
    Quantity:
      type: string
      description: Cantidad mayor que cero.
      pattern: '^([1-9][0-9]{0,9}(\.[0-9]{1,4})?|0\.([1-9][0-9]{0,3}|0[1-9][0-9]{0,2}|00[1-9][0-9]?|000[1-9]))$'
    ExchangeRate:
      type: string
      description: Soles por USD con exactamente 3 decimales, hasta 3 enteros (igual que tipo_cambio de Khipu). Obligatorio si currency = USD y prohibido si PEN.
      pattern: '^[0-9]{1,3}\.[0-9]{3}$'
      examples: ['3.756']
    Currency:
      type: string
      enum: [PEN, USD]
    DocumentType:
      type: string
      description: Abierto; los clientes deben tolerar valores nuevos.
      enum: [boleta, factura, nota_credito, nota_debito, guia_remision]
    CpeStatus:
      type: string
      enum: [pendiente, enviado, aceptado, observado, rechazado, anulado]
    PaymentMethod:
      type: string
      description: credito solo en factura (Khipu emite la boleta al contado).
      enum: [efectivo, tarjeta, yape, plin, transferencia, credito]
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        total:
          type: integer
          minimum: 0
          description: Solo si el endpoint lo declara y la petición trae includeTotal=true (conventions.md §5).
        totalIsEstimate:
          type: boolean
          description: Presente junto con total; true si es una estimación o un conteo con tope.
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Uno de la lista cerrada de conventions.md §4; un valor desconocido se trata por status y title.
          examples: [insufficient_stock]
        detail: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              meta: { type: object, additionalProperties: true }
    CreateSaleRequest:
      type: object
      description: |
        La caja y la sede salen de la sesión; shiftId debe ser el turno abierto de esa caja
        (409 shift_not_open si no). La serie se toma de (caja, documentType).
      required: [shiftId, documentType, currency, lines, payments, expectedTotal]
      properties:
        shiftId: { type: string, format: uuid }
        documentType: { type: string, enum: [boleta, factura] }
        currency: { $ref: '#/components/schemas/Currency' }
        exchangeRate:
          description: Obligatorio si currency = USD (422 exchange_rate_required); prohibido si PEN.
          oneOf:
            - $ref: '#/components/schemas/ExchangeRate'
            - type: 'null'
        customerId:
          type: [string, 'null']
          format: uuid
          description: Obligatorio para factura. null = cliente varios (boleta en soles hasta S/ 700.00, límite de Khipu).
        quoteId: { type: [string, 'null'], format: uuid }
        discountApprovalToken:
          type: [string, 'null']
          description: Token de re-autenticación del supervisor si algún descuento supera el tope del rol (ventas.discounts:approve).
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [variantId, quantity, unitPrice]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { $ref: '#/components/schemas/Quantity' }
              unitPrice: { $ref: '#/components/schemas/UnitPrice' }
              discount: { $ref: '#/components/schemas/MoneyNonNegative' }
              discountReason: { type: string, maxLength: 200, description: Obligatorio si discount > 0. }
        payments:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [method, currency, amount]
            properties:
              method: { $ref: '#/components/schemas/PaymentMethod' }
              currency: { $ref: '#/components/schemas/Currency' }
              amount: { $ref: '#/components/schemas/MoneyPositive' }
              exchangeRate:
                description: Obligatorio si la moneda del pago difiere de la de la venta.
                oneOf:
                  - $ref: '#/components/schemas/ExchangeRate'
                  - type: 'null'
              reference: { type: string, maxLength: 64 }
        expectedTotal:
          $ref: '#/components/schemas/MoneyPositive'
    SaleCreated:
      type: object
      required: [saleId, total, currency, change, document]
      properties:
        saleId: { type: string, format: uuid }
        total: { $ref: '#/components/schemas/MoneyPositive' }
        currency: { $ref: '#/components/schemas/Currency' }
        change: { $ref: '#/components/schemas/MoneyNonNegative' }
        document: { $ref: '#/components/schemas/SalesDocument' }
    SalesDocument:
      type: object
      description: Forma de SalesDocument de types/domain.ts, con importes como string. number es null en una GRE hasta que Khipu la numera.
      required: [id, type, series, number, customerName, customerDocument, total, currency, sunatStatus, issuedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DocumentType' }
        series: { type: string, pattern: '^[A-Z0-9]{4}$' }
        number: { type: [integer, 'null'], minimum: 1, maximum: 99999999 }
        display: { type: [string, 'null'], examples: ['F001-00000842'] }
        customerName: { type: string }
        customerDocument: { type: string }
        total: { $ref: '#/components/schemas/MoneyNonNegative' }
        currency: { $ref: '#/components/schemas/Currency' }
        exchangeRate:
          oneOf:
            - $ref: '#/components/schemas/ExchangeRate'
            - type: 'null'
        sunatStatus: { $ref: '#/components/schemas/CpeStatus' }
        issuedAt: { type: string, format: date-time }
    Entitlements:
      type: object
      description: |
        Lo que la empresa tiene habilitado (paquete `internal/platform/entitlements`). `modules` y `flags`
        van ordenados y vacíos si la suscripción no es activa ni trial (cierra en falla). `limits` trae los
        topes del plan; todo plan declara todas las claves (CHECK en `platform.plans`) y viene vacío sin plan.
        Una clave ausente es tope 0, nunca «sin tope»: la falta de dato cierra. No hay topes ilimitados; un
        plan holgado declara un número alto. `usage` es el uso del mes de Lima.
        `version` identifica el contenido sin el uso: sirve de ETag.
      required: [modules, flags, limits, usage, status, readOnly, version]
      properties:
        modules: { type: array, items: { type: string, examples: ['ventas', 'rubro.lubricentro'] } }
        flags: { type: array, items: { type: string } }
        limits:
          type: object
          description: 'Claves actuales: users, sites, cpe_per_month.'
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        usage:
          type: object
          description: 'Claves actuales: users, cpe_per_month.'
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [trial, activa, morosa, suspendida, cancelada, sin_plan] }
        readOnly: { type: boolean, description: 'true si la empresa está cerrada: todo método distinto de GET da 403 tenant_read_only.' }
        version: { type: string, pattern: '^[0-9a-f]{16}$' }
