name: API

# The workflow has no `paths:` filter on purpose: a workflow skipped by a path
# filter leaves its required check "Pending" and blocks the PR. Instead the job
# always runs and decides in its first step whether apps/api (or this file)
# changed (or the RLS reference cases in docs/architecture/data/rls-check/); if
# not, the Go steps are skipped and the check ends green.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    name: api (gofmt, vet, test, build, arch-lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # PostgreSQL 16 real para los tests de integración (sin mocks de base). Las
    # contraseñas de abajo son solo de la CI, de una base desechable: no son
    # secretos y nunca van en el SQL versionado.
    services:
      postgres:
        image: postgres:16-alpine@sha256:1758b87430847848ff5a71cbdd898c7a21e469166c3e25244940f05ea97800ad
        env:
          POSTGRES_DB: wanka
          POSTGRES_PASSWORD: ci-superuser-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wanka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did apps/api, the RLS cases or this workflow change?
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(apps/api/|docs/architecture/data/rls-check/|\.github/workflows/api\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes in apps/api: Go steps skipped."
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod
      - name: gofmt (fails on any diff)
        if: steps.changes.outputs.run == 'true'
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt differences in:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        if: steps.changes.outputs.run == 'true'
        run: go vet ./...
      # Migraciones solo hacia adelante; el script también prueba sus casos malos.
      - name: migrations are forward-only
        if: steps.changes.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ "$EVENT" != "pull_request" ]; then base="$BEFORE_SHA"; fi
          case "$base" in ""|0000000000000000000000000000000000000000) base=origin/main ;; esac
          sh scripts/migrations-check.sh "$base"
      # Bootstrap de roles como superusuario del contenedor (fuera de goose) y
      # contraseñas de prueba; luego migrate up desde cero como wanka_migrator.
      - name: bootstrap roles
        if: steps.changes.outputs.run == 'true'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: wanka
          PGUSER: postgres
          PGPASSWORD: ci-superuser-not-a-secret
          WANKA_CI_ROLE_PASSWORD: ci-roles-not-a-secret
        run: |
          psql -X -v ON_ERROR_STOP=1 -f bootstrap/roles.sql
          psql -X -v ON_ERROR_STOP=1 -v pw="$WANKA_CI_ROLE_PASSWORD" <<'SQL'
          ALTER ROLE wanka_migrator PASSWORD :'pw';
          ALTER ROLE wanka_app PASSWORD :'pw';
          ALTER ROLE wanka_worker PASSWORD :'pw';
          ALTER ROLE wanka_webhooks PASSWORD :'pw';
          ALTER ROLE wanka_platform PASSWORD :'pw';
          SQL
      - name: migrate up from scratch (twice)
        if: steps.changes.outputs.run == 'true'
        env:
          DATABASE_URL_MIGRATOR: postgres://wanka_migrator:ci-roles-not-a-secret@localhost:5432/wanka
        run: |
          go build -o bin/wanka ./cmd/wanka
          ./bin/wanka migrate up | tee first.log
          grep -q '"msg":"migration applied"' first.log
          ./bin/wanka migrate up | tee second.log
          grep -q '"applied":0' second.log
          if grep -q '"msg":"migration applied"' second.log; then echo "second run changed something"; exit 1; fi
      - name: go test
        if: steps.changes.outputs.run == 'true'
        env:
          WANKA_TEST_ADMIN_URL: postgres://postgres:ci-superuser-not-a-secret@localhost:5432/wanka
          WANKA_TEST_ROLE_PASSWORD: ci-roles-not-a-secret
        run: go test -race ./...
      # ADR 0001: los casos de referencia de RLS corren en un contenedor propio
      # de PostgreSQL 16 con los roles reales (Docker del runner). Deben pasar, y
      # la mutación naive_session_lookup debe hacerlos fallar: si no fallara, la
      # verificación no detectaría el defecto que dice vigilar.
      - name: RLS reference cases pass (rls-check/run.sh)
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        run: sh docs/architecture/data/rls-check/run.sh
      - name: RLS reference cases fail under MUTATION=naive_session_lookup
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        run: |
          rc=0; log="$(mktemp)"
          MUTATION=naive_session_lookup sh docs/architecture/data/rls-check/run.sh > "$log" 2>&1 || rc=$?
          cat "$log"
          # exit 1 es un caso que falló; otro valor (p. ej. 2: Docker no arrancó) no prueba nada.
          if [ "$rc" -ne 1 ] || ! grep -q "^FAILED at:" "$log"; then
            echo "expected the mutation to make a case fail (exit 1), got exit $rc"
            exit 1
          fi
          echo "OK: the mutation was detected"
      - name: go build
        if: steps.changes.outputs.run == 'true'
        run: go build ./...
      # Version pinned in scripts/archlint.sh. The script also proves that a
      # forbidden cross-module import makes go-arch-lint fail.
      - name: go-arch-lint
        if: steps.changes.outputs.run == 'true'
        run: sh scripts/archlint.sh
