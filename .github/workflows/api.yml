name: API

# El workflow no lleva filtro `paths:` a propósito: un workflow omitido por ese
# filtro deja su check requerido en «Pending» y bloquea el PR. En cambio el job
# siempre corre y decide en su primer paso si cambió apps/api, este archivo, los
# casos de RLS (docs/architecture/data/rls-check/) o los dos documentos que fija la paridad
# del catálogo de permisos (api/resources.md y adr/0004-in-house-auth.md); si no, los pasos de Go se
# omiten y el check termina en verde.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    name: api (gofmt, vet, test, build, arch-lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # PostgreSQL 16 real para los tests de integración (sin mocks de base). Las
    # contraseñas de abajo son solo de la CI, de una base desechable: no son
    # secretos y nunca van en el SQL versionado.
    services:
      postgres:
        image: postgres:16-alpine@sha256:1758b87430847848ff5a71cbdd898c7a21e469166c3e25244940f05ea97800ad
        env:
          POSTGRES_DB: wanka
          POSTGRES_PASSWORD: ci-superuser-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wanka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did apps/api, the RLS cases, the permission documents or this workflow change?
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(apps/api/|docs/architecture/data/rls-check/|docs/architecture/api/resources\.md$|docs/architecture/adr/0004-in-house-auth\.md$|\.github/workflows/api\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes in apps/api: Go steps skipped."
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod
      - name: gofmt (fails on any diff)
        if: steps.changes.outputs.run == 'true'
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt differences in:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        if: steps.changes.outputs.run == 'true'
        run: go vet ./...
      # testdata queda fuera de ./...: el harness de carga (servidor + k6) se
      # compila aparte para que no se pudra, sin ser un paquete más del módulo
      # (un main nuevo en cmd/ o internal/ entraría en go-arch-lint y en ./...).
      - name: go vet load test harness
        if: steps.changes.outputs.run == 'true'
        run: go vet ./testdata/loadtest
      # Migraciones solo hacia adelante; el script también prueba sus casos malos.
      - name: migrations are forward-only
        if: steps.changes.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ "$EVENT" != "pull_request" ]; then base="$BEFORE_SHA"; fi
          case "$base" in ""|0000000000000000000000000000000000000000) base=origin/main ;; esac
          sh scripts/migrations-check.sh "$base"
      # Bootstrap de roles como superusuario del contenedor (fuera de goose) y
      # contraseñas de prueba; luego migrate up desde cero como wanka_migrator.
      - name: bootstrap roles
        if: steps.changes.outputs.run == 'true'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: wanka
          PGUSER: postgres
          PGPASSWORD: ci-superuser-not-a-secret
          WANKA_CI_ROLE_PASSWORD: ci-roles-not-a-secret
        run: |
          psql -X -v ON_ERROR_STOP=1 -f bootstrap/roles.sql
          psql -X -v ON_ERROR_STOP=1 -v pw="$WANKA_CI_ROLE_PASSWORD" <<'SQL'
          ALTER ROLE wanka_migrator PASSWORD :'pw';
          ALTER ROLE wanka_app PASSWORD :'pw';
          ALTER ROLE wanka_worker PASSWORD :'pw';
          ALTER ROLE wanka_webhooks PASSWORD :'pw';
          ALTER ROLE wanka_platform PASSWORD :'pw';
          SQL
      - name: migrate up from scratch (twice)
        if: steps.changes.outputs.run == 'true'
        env:
          DATABASE_URL_MIGRATOR: postgres://wanka_migrator:ci-roles-not-a-secret@localhost:5432/wanka
        run: |
          go build -o bin/wanka ./cmd/wanka
          ./bin/wanka migrate up | tee first.log
          grep -q '"msg":"migration applied"' first.log
          ./bin/wanka migrate up | tee second.log
          grep -q '"applied":0' second.log
          if grep -q '"msg":"migration applied"' second.log; then echo "second run changed something"; exit 1; fi
      - name: go test
        if: steps.changes.outputs.run == 'true'
        env:
          WANKA_TEST_ADMIN_URL: postgres://postgres:ci-superuser-not-a-secret@localhost:5432/wanka
          WANKA_TEST_ROLE_PASSWORD: ci-roles-not-a-secret
        run: go test -race ./...
      # Las cotas de tiempo se saltan con -race (el detector multiplica los tiempos):
      # aquí corren sin él.
      - name: go test (timing bounds, no -race)
        if: steps.changes.outputs.run == 'true'
        run: go test -count=1 -run 'Under[0-9]+ms' ./internal/platform/pricing/
      # ADR 0001: los casos de referencia de RLS corren en un contenedor propio de
      # PostgreSQL 16 con los roles reales (Docker del runner). Deben pasar, y la
      # mutación naive_session_lookup debe hacerlos fallar en el paso wanka_app; el
      # script también prueba que una mutación inexistente no cuenta como detectada.
      - name: RLS reference cases (pass, and the mutation is detected)
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        run: sh apps/api/scripts/rls-check.sh
      - name: go build
        if: steps.changes.outputs.run == 'true'
        run: go build ./...
      # Versión fijada en scripts/archlint.sh. El script también prueba que una
      # importación prohibida entre módulos, o de pgxpool/stdlib fuera de
      # internal/platform/db, hace fallar a go-arch-lint.
      - name: go-arch-lint
        if: steps.changes.outputs.run == 'true'
        run: sh scripts/archlint.sh
