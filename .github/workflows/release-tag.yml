# Crea el tag vX.Y.Z cuando el dueño mergea en main un PR de release
# (`chore(release): vX.Y.Z`) y los workflows CI y API pasan sobre ese commit.
# El merge del release es la aprobación del dueño (docs/delivery-process.md).
name: release-tag

on:
  workflow_run:
    workflows: [CI, API]
    types: [completed]
    branches: [main]
  # Salida manual, la lanza el dueño: tag de un commit de main ya en verde,
  # cuando el arreglo del release llegó en otro commit.
  workflow_dispatch:
    inputs:
      sha:
        description: commit de main a etiquetar (40 hex)
        required: true

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: release-tag-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: tag the release merge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="${RUN_SHA:-$INPUT_SHA}"
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then echo "invalid sha"; exit 1; fi
          # El commit tiene que estar en main.
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main"; exit 1; }
          git checkout -q "$SHA"
          # Automático: solo el merge de un PR de release. Manual (dispatch): el dueño
          # elige un commit de main posterior al release; la versión manda.
          title=""
          if [ -n "${RUN_SHA:-}" ]; then
            title=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].title // ""')
            case "$title" in
              "chore(release): v"*) ;;
              *) echo "not a release merge ($title); nothing to tag"; exit 0 ;;
            esac
          fi
          version=$(node -p "require('./package.json').version")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "invalid version $version"; exit 1; fi
          web=$(node -p "require('./apps/web/package.json').version")
          if [ "$web" != "$version" ]; then echo "apps/web/package.json is $web, root is $version"; exit 1; fi
          tag="v$version"
          if [ -n "$title" ] && [ "${title#chore(release): }" != "$tag" ]; then
            echo "PR title says ${title#chore(release): } but package.json is $version"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            at=$(git rev-list -n 1 "$tag")
            if [ "$at" = "$SHA" ]; then echo "$tag already exists at $SHA"; exit 0; fi
            echo "$tag already exists at $at, not at $SHA: not moving it"; exit 1
          fi
          # Los dos workflows tienen que haber pasado sobre este commit.
          for wf in CI API; do
            ok=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=push" \
              --jq "[.workflow_runs[] | select(.name == \"$wf\") | .conclusion] | any(. == \"success\")")
            if [ "$ok" != "true" ]; then echo "$wf is not green on $SHA yet"; exit 0; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$SHA"
          git push origin "$tag"
          echo "tagged $tag at $SHA"
