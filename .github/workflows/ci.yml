name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (lint, typecheck, unit, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # keep the pnpm store out of the pnpm install dir (its .bin path breaks the tsc build
      # of the khipu-design-system git dependency with TS2742)
      npm_config_store_dir: /home/runner/.pnpm-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e (playwright, production build)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      npm_config_store_dir: /home/runner/.pnpm-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium with system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Install system deps only (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      - run: pnpm build
      # The config uses the list reporter and no retries; html reporter + retain-on-failure
      # traces are requested here so a failure leaves a report and traces to upload.
      - run: pnpm test:e2e --reporter=list,html --trace=retain-on-failure
        env:
          E2E_PROD: "1"
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
