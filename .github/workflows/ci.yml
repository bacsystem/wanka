name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep the pnpm store out of the pnpm install dir (its .bin path breaks the tsc build of the
  # khipu-design-system git dependency with TS2742). Workaround for
  # https://github.com/bacsystem/khipu-design-system/issues/59
  npm_config_store_dir: /home/runner/.pnpm-store

jobs:
  checks:
    name: checks (lint, typecheck, unit, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e (playwright, production build)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Sin filtro `paths:` a propósito: un workflow saltado por ruta deja el check
      # requerido en «Pending» y bloquea el PR. El job siempre corre y aquí decide si
      # cambió el frontend; si no, salta los pasos y el check termina en verde.
      - name: Did the frontend or this workflow change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(apps/web/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend changes: e2e steps skipped."
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.run == 'true'
      - name: Resolve Playwright version
        if: steps.changes.outputs.run == 'true'
        id: pw
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: steps.changes.outputs.run == 'true'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium with system deps
        if: steps.changes.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Install system deps only (browsers cached)
        if: steps.changes.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      - run: pnpm build
        if: steps.changes.outputs.run == 'true'
      # The config uses the list reporter and no retries; html reporter + retain-on-failure
      # traces are requested here so a failure leaves a report and traces to upload.
      - run: pnpm test:e2e --reporter=list,html --trace=retain-on-failure
        if: steps.changes.outputs.run == 'true'
        env:
          E2E_PROD: "1"
      - name: Upload Playwright report and traces
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
