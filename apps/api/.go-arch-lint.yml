# Architecture rules for apps/api (ADR 0002). Check: scripts/archlint.sh
#
# The kernel (internal/platform) is shared by everyone and imports no module.
# The rule that keeps modules apart is exercised on a fixture:
# testdata/archlint/.go-arch-lint.yml. When a module is added under
# internal/<module>/, add its pair of components to this file following that
# fixture: <module> (the facade, package internal/<module>) and <module>_inner
# (domain, app, adapters), so no other module can import its inner packages.
#
# workdir es la raíz del módulo para que entren al grafo los paquetes que
# embeben archivos SQL, que deben estar junto a ellos (migrations/, bootstrap/).
# El fixture conserva workdir internal: solo ejercita la regla entre módulos.
version: 3
workdir: .
components:
  # db es el único dueño de pgxpool (ADR 0001): el resto del kernel y los módulos
  # reciben *db.Pool y no pueden construir ni usar un pgxpool.Pool propio.
  platform_db: { in: internal/platform/db/** }
  platform: { in: internal/platform/* }
  main: { in: cmd/** }
  migrations: { in: migrations }
  bootstrap: { in: bootstrap }
vendors:
  # pgx sin pgxpool: ese paquete es un vendor aparte que solo usa internal/platform/db.
  pgx: { in: [github.com/jackc/pgx/v5, github.com/jackc/pgx/v5/pgconn, github.com/jackc/pgx/v5/pgconn/**, github.com/jackc/pgx/v5/pgtype, github.com/jackc/pgx/v5/pgtype/**, github.com/jackc/pgx/v5/pgproto3, github.com/jackc/pgx/v5/stdlib] }
  pgxpool: { in: github.com/jackc/pgx/v5/pgxpool }
  goose: { in: [github.com/pressly/goose/v3, github.com/pressly/goose/v3/**] }
deps:
  platform_db:
    mayDependOn: [platform, platform_db, migrations, bootstrap]
    canUse: [pgx, pgxpool, goose]
  platform:
    mayDependOn: [platform, platform_db, migrations, bootstrap]
    canUse: [pgx, goose]
  main:
    mayDependOn: [platform, platform_db, migrations]
    canUse: [pgx]
exclude:
  - testdata
