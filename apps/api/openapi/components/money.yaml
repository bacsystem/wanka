openapi: 3.1.0
info:
  title: Wanka API - dinero y cantidades
  version: 0.1.0-draft
paths: {}
components:
  schemas:
    MoneyPositive:
      type: string
      description: Importe mayor que cero (CHECK amount > 0 / total > 0 en la base). Sin lookahead, porque Go (RE2) no lo soporta; cada patrón se compila con regexp en CI.
      pattern: '^(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,11}\.[0-9]{2})$'
      examples: ['118.00']
    MoneyNonNegative:
      type: string
      description: Importe mayor o igual que cero (descuentos; CHECK >= 0).
      pattern: '^[0-9]{1,12}\.[0-9]{2}$'
      examples: ['0.00']
    UnitPrice:
      type: string
      description: Precio unitario con IGV, mayor que cero (Khipu y SUNAT rechazan precio cero o negativo).
      pattern: '^([1-9][0-9]{0,9}(\.[0-9]{1,4})?|0\.([1-9][0-9]{0,3}|0[1-9][0-9]{0,2}|00[1-9][0-9]?|000[1-9]))$'
    Quantity:
      type: string
      description: Cantidad mayor que cero.
      pattern: '^([1-9][0-9]{0,9}(\.[0-9]{1,4})?|0\.([1-9][0-9]{0,3}|0[1-9][0-9]{0,2}|00[1-9][0-9]?|000[1-9]))$'
    ExchangeRate:
      type: string
      description: Soles por USD con exactamente 3 decimales, hasta 3 enteros (igual que tipo_cambio de Khipu). Obligatorio si currency = USD y prohibido si PEN.
      pattern: '^[0-9]{1,3}\.[0-9]{3}$'
      examples: ['3.756']
    Currency:
      type: string
      enum: [PEN, USD]
