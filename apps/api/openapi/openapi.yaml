openapi: 3.1.0
info:
  title: Wanka API (plano tenant)
  version: 0.1.0-draft
  description: |
    Contrato de la API del plano tenant (ADR 0009). Este archivo es la raíz: cada camino es un $ref
    al archivo de su módulo (paths/<módulo>.yaml, uno por código de platform.modules) y lo compartido
    (errores, paginación, dinero, cabeceras, comprobantes) está en components/. Un módulo edita solo
    su archivo; aquí solo se agrega la línea de su camino, dentro de su bloque.
servers:
  - url: http://api.railway.internal:8080
    description: Red privada (solo el BFF de Next.js)
security:
  - tenantSession: []
tags:
  - name: identidad
    description: Login, 2FA, sesión, usuario y entitlements de la empresa (rutas /v1/auth/* y /v1/me/*)
  - name: empresas
    description: Datos de la empresa, sedes y cajas
  - name: catalogo
    description: Productos, servicios, variantes y precios
  - name: clientes
    description: Clientes y proveedores
  - name: inventario
    description: Inventario multialmacén
  - name: ventas
    description: POS y proformas
  - name: compras
    description: Órdenes de compra y recepciones
  - name: finanzas
    description: Caja, cuentas por cobrar y por pagar
  - name: facturacion-electronica
    description: CPE, notas, bajas y guías vía InvoicingProvider
  - name: reportes
    description: Reportes y exportes
  - name: notificaciones
    description: Avisos por correo y recordatorios
  - name: auditoria
    description: Registro de auditoría de la empresa
  - name: integraciones
    description: Integraciones con servicios externos
  - name: rubro.lubricentro
    description: 'Lubricentros: órdenes de servicio y vehículos'
  - name: rubro.libreria
    description: 'Librerías: ediciones, ISBN y consignación'
  - name: rubro.restaurante
    description: 'Restaurantes: salón, comandas, delivery y reservas'
  - name: rubro.veterinaria
    description: 'Veterinarias: mascotas, hospitalización y grooming'
  - name: rubro.odontologia
    description: 'Odontologías: agenda e historia clínica'
  - name: rubro.retail
    description: 'Retail: tiendas y variantes de producto'
  - name: agenda
    description: Agenda de citas
  - name: integraciones.whatsapp
    description: Mensajes por WhatsApp
paths:
  # --- identidad ---
  /v1/auth/login:
    $ref: 'paths/identidad.yaml#/paths/~1v1~1auth~1login'
  /v1/auth/mfa/enrollment/totp:
    $ref: 'paths/identidad.yaml#/paths/~1v1~1auth~1mfa~1enrollment~1totp'
  /v1/auth/mfa/enrollment/totp/confirm:
    $ref: 'paths/identidad.yaml#/paths/~1v1~1auth~1mfa~1enrollment~1totp~1confirm'
  /v1/auth/mfa/enrollment/email-code/resend:
    $ref: 'paths/identidad.yaml#/paths/~1v1~1auth~1mfa~1enrollment~1email-code~1resend'
  /v1/me/entitlements:
    $ref: 'paths/identidad.yaml#/paths/~1v1~1me~1entitlements'
  # --- empresas ---
  # --- catalogo ---
  # --- clientes ---
  # --- inventario ---
  # --- ventas ---
  /v1/sales:
    $ref: 'paths/ventas.yaml#/paths/~1v1~1sales'
  # --- compras ---
  # --- finanzas ---
  # --- facturacion-electronica ---
  /v1/einvoicing/documents:
    $ref: 'paths/facturacion-electronica.yaml#/paths/~1v1~1einvoicing~1documents'
  # --- reportes ---
  # --- notificaciones ---
  # --- auditoria ---
  # --- integraciones ---
  # --- rubro.lubricentro ---
  # --- rubro.libreria ---
  # --- rubro.restaurante ---
  # --- rubro.veterinaria ---
  # --- rubro.odontologia ---
  # --- rubro.retail ---
  # --- agenda ---
  # --- integraciones.whatsapp ---
components:
  securitySchemes:
    tenantSession:
      type: http
      scheme: bearer
      description: Token opaco con prefijo wk_at_. Los tokens wka_ (plataforma) se rechazan.
