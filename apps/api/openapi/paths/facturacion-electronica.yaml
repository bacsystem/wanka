openapi: 3.1.0
info:
  title: Wanka API - facturación electrónica
  version: 0.1.0-draft
paths:
  /v1/einvoicing/documents:
    get:
      tags: [facturacion-electronica]
      operationId: listDocuments
      x-module: facturacion-electronica
      x-permission: facturacion.cpe:read
      summary: Lista comprobantes del tenant de la sesión
      parameters:
        - { name: type, in: query, schema: { type: array, items: { $ref: '../components/documents.yaml#/components/schemas/DocumentType' } }, explode: true }
        - { name: status, in: query, schema: { type: array, items: { $ref: '../components/documents.yaml#/components/schemas/CpeStatus' } }, explode: true }
        - { name: issuedFrom, in: query, schema: { type: string, format: date } }
        - { name: issuedTo, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '../components/pagination.yaml#/components/parameters/Limit'
        - $ref: '../components/pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de comprobantes, más recientes primero
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '../components/documents.yaml#/components/schemas/SalesDocument' } }
                  page: { $ref: '../components/pagination.yaml#/components/schemas/PageInfo' }
        '401': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '403': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '503': { $ref: '../components/problem.yaml#/components/responses/Problem' }
