openapi: 3.1.0
info:
  title: Wanka API - identidad
  version: 0.1.0-draft
paths:
  /v1/auth/login:
    post:
      tags: [identidad]
      operationId: login
      security: []
      x-module: none
      x-permission: none
      summary: Inicia sesión con correo y contraseña
      description: |
        Clase Public, sin Bearer. El correo se normaliza con TrimSpace y ToLower antes de buscarlo. Orden
        (ADR 0004, nota del 2026-11-19): esquema (400 o 422), cuotas (5/min por IP+email y 30/min por IP, la
        IP es la de X-Client-Ip, conventions.md §3 y §7: 429 rate_limited con Retry-After), semáforo del hash
        (sin cupo: 503 overloaded con Retry-After 1, sin cobrar el intento), cobro del intento, hash (ficticio
        si la cuenta no existe, está bloqueada, cerrada, es de un usuario bloqueado o no tiene contraseña) y
        resultado. Contraseña mala, correo inexistente, cuenta bloqueada o cerrada, usuario bloqueado, sin
        contraseña y segundo paso cerrado tras 3 bloqueos: el mismo 401 invalid_credentials, con el mismo
        cuerpo (la API nunca dice que la cuenta existe). Cada 5.º fallo seguido bloquea la cuenta
        15 min · 2^(n-1), hasta 24 h, y avisa por correo; con 100 fallos seguidos el ingreso con contraseña
        queda cerrado hasta restablecerla (ADR 0014). Una contraseña correcta devuelve el cobro. Con la contraseña correcta y ninguna
        membresía activa: 403 tenant_access_denied, sin sesión. Con la contraseña correcta y el segundo paso
        bloqueado: 429 rate_limited con Retry-After hasta el fin del bloqueo. La rama
        mfa_enrollment_required responde 503 dependency_unavailable con Retry-After 60 hasta que #25 la
        implemente. Idempotency-Key no se acepta en /v1/auth/*: 400 malformed_request.
      parameters:
        - $ref: '../components/headers.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión creada, o segundo paso pendiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '401': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '403': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '422': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '429': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '503': { $ref: '../components/problem.yaml#/components/responses/Problem' }
  /v1/auth/mfa/enrollment/totp:
    post:
      tags: [identidad]
      operationId: startMfaEnrollment
      security: []
      x-module: none
      x-permission: none
      summary: Entrega el secreto TOTP pendiente del enrolamiento obligatorio del login
      description: |
        Clase Public (conventions.md §2): sin sesión, con el enrollmentToken en el cuerpo y nunca como
        Bearer. Lo llama el BFF después de que POST /v1/auth/login respondió MfaEnrollmentRequired.
        Sin efectos visibles: con el mismo token vigente devuelve siempre el mismo secreto (no lo rota)
        y no manda correo (el emailCode sale en el login). Orden de comprobación (conventions.md §2):
        esquema (400/422), token vencido, consumido o inexistente (401 session_expired, #187),
        segundo paso bloqueado (429 rate_limited con Retry-After). Un token
        consumido por el bloqueo da 401. Idempotency-Key no se acepta en /v1/auth/*: 400
        malformed_request (conventions.md §3).
      parameters:
        - $ref: '../components/headers.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollmentTokenRequest' }
      responses:
        '200':
          description: Secreto pendiente; se confirma con /v1/auth/mfa/enrollment/totp/confirm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaTotpSecret' }
        '400': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '401': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '422': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '429': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '503': { $ref: '../components/problem.yaml#/components/responses/Problem' }
  /v1/auth/mfa/enrollment/totp/confirm:
    post:
      tags: [identidad]
      operationId: confirmMfaEnrollment
      security: []
      x-module: none
      x-permission: none
      summary: Activa la 2FA con el primer código TOTP y el emailCode, y crea la sesión
      description: |
        Clase Public. Exige el código TOTP del autenticador recién configurado y el emailCode que el
        login mandó al correo del usuario (decisión del dueño, #25; reglas en conventions.md §2).
        - Los dos correctos: guarda el TOTP y los códigos de recuperación, crea la sesión con
          mfa_method = totp, consume el token y pone en 0 el contador de segundo paso. Responde 200.
        - Uno o los dos incorrectos: 422 validation_failed con un elemento de errors[] por campo
          incorrecto (field code o emailCode, code validation_failed, meta.attemptsRemaining). Cuenta un
          fallo en el contador del usuario, compartido con /v1/auth/mfa/verify; no consume el token.
        - 5.º fallo seguido: el segundo paso queda bloqueado 15 min, todos los tokens de paso vivos
          del usuario se consumen sin crear sesión y responde 429 rate_limited con Retry-After hasta
          el fin del bloqueo. Después, ese token da 401 (el token se comprueba antes que el bloqueo).
        - Cada bloqueo avisa por correo. El 3.er bloqueo desde el último restablecimiento de
          contraseña (un segundo paso correcto no los reinicia): el segundo paso queda cerrado hasta
          restablecer la contraseña, y el usuario recibe un aviso por correo (conventions.md §2).
        - Formato inválido (no son 6 dígitos): 422 validation_failed del esquema; no cuenta.
        - Sin el secreto pendiente (no se llamó /v1/auth/mfa/enrollment/totp con este token): 409
          invalid_state_transition; no cuenta.
        - Token vencido, consumido o inexistente: 401 session_expired (#187). El emailCode vence con
          el token (10 min desde el login).
        Idempotency-Key no se acepta en /v1/auth/*: 400 malformed_request sin ejecutar nada
        (conventions.md §3), porque el 422 y el 429 confirman el contador y el bloqueo.
      parameters:
        - $ref: '../components/headers.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollmentConfirmRequest' }
      responses:
        '200':
          description: 2FA activa y sesión creada, sin empresa elegida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollmentConfirmed' }
        '400': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '401': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '409': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '422': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '429': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '503': { $ref: '../components/problem.yaml#/components/responses/Problem' }
  /v1/auth/mfa/enrollment/email-code/resend:
    post:
      tags: [identidad]
      operationId: resendMfaEnrollmentEmailCode
      security: []
      x-module: none
      x-permission: none
      summary: Manda un emailCode nuevo al correo del usuario del enrollmentToken
      description: |
        Clase Public, con el enrollmentToken en el cuerpo. Genera un código nuevo (el anterior deja de
        valer) y lo manda por el Mailer después del COMMIT; no alarga el token. Topes (conventions.md
        §2): 3 envíos por token contando el del login, 60 s entre envíos, y por usuario 10 envíos por
        hora y 20 en 24 h. Orden de comprobación: esquema, token (vencido, consumido o inexistente:
        401 session_expired, #187), bloqueo vigente y topes (429 rate_limited con Retry-After). Si
        el Mailer falla o vence (5 s): 503 dependency_unavailable con Retry-After 60, y el envío
        cuenta. Idempotency-Key no se acepta en /v1/auth/*: 400 malformed_request.
      parameters:
        - $ref: '../components/headers.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollmentTokenRequest' }
      responses:
        '202':
          description: Código nuevo enviado al Mailer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEmailCodeResent' }
        '400': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '401': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '422': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '429': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '503': { $ref: '../components/problem.yaml#/components/responses/Problem' }
  /v1/me/entitlements:
    get:
      tags: [identidad]
      operationId: getMyEntitlements
      x-module: none
      x-permission: none
      summary: Módulos, flags y límites habilitados para la empresa de la sesión
      description: |
        Lee `entitlements.For` (ADR 0005) para el tenant de la sesión, de la caché en memoria (TTL 30 s,
        invalidada por NOTIFY): nunca incluye datos de otra empresa. Pasa también con la suscripción
        inactiva (`status` morosa, suspendida o cancelada) o la empresa cerrada (`readOnly`), para que la UI
        muestre el motivo del bloqueo (conventions.md §4). Sin suscripción: `status` es `sin_plan` y las listas
        vienen vacías (una empresa cerrada sin suscripción trae solo los módulos que un override encienda). La UI usa esto solo para ocultar menús; la API es la que aplica.
        `x-module: none` y `x-permission: none` (ADR 0009, «Cómo se declara ninguno»): solo pide una sesión
        ligada a una empresa, sin módulo ni permiso, porque quien no tiene plan o tiene la suscripción inactiva
        no tiene ningún módulo y aun así tiene que poder leer el motivo.
      responses:
        '200':
          description: Entitlements de la empresa de la sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
        '401': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '403': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '429': { $ref: '../components/problem.yaml#/components/responses/Problem' }
        '503': { $ref: '../components/problem.yaml#/components/responses/Problem' }
components:
  schemas:
    EnrollmentToken:
      type: string
      description: Token de paso del enrolamiento (wk_en_ + 32 bytes en base64url sin relleno, conventions.md §2). TTL 10 min desde el login.
      pattern: '^wk_en_[A-Za-z0-9_-]{43}$'
    TotpCode:
      type: string
      description: Código TOTP de 6 dígitos (RFC 6238, 30 s, ventana ±1).
      pattern: '^[0-9]{6}$'
    EmailCode:
      type: string
      description: Código de un solo uso enviado al correo en el enrolamiento obligatorio. Vence con el enrollmentToken; en la base solo va su HMAC (conventions.md §2).
      pattern: '^[0-9]{6}$'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Se normaliza (TrimSpace y ToLower) antes de buscarlo; la longitud se mide ya normalizado.
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: Hasta 128 caracteres. La política de contraseña nueva se aplica al definirla, no al ingresar.
    LoginResponse:
      description: Resultado del login; el discriminador es status.
      oneOf:
        - $ref: '#/components/schemas/LoginAuthenticated'
        - $ref: '#/components/schemas/LoginMfaRequired'
        - $ref: '#/components/schemas/MfaEnrollmentRequired'
      discriminator:
        propertyName: status
        mapping:
          authenticated: '#/components/schemas/LoginAuthenticated'
          mfa_required: '#/components/schemas/LoginMfaRequired'
          mfa_enrollment_required: '#/components/schemas/MfaEnrollmentRequired'
    LoginAuthenticated:
      type: object
      description: Sesión sin empresa elegida (mfa_method none); el BFF pone las cookies y decide el siguiente paso con memberships.
      required: [status, accessToken, refreshToken, expiresAt, memberships]
      properties:
        status: { type: string, const: authenticated }
        accessToken: { type: string, pattern: '^wk_at_[A-Za-z0-9_-]{43}$' }
        refreshToken: { type: string, pattern: '^wk_rt_[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time, description: 'Vencimiento del accessToken (15 min), RFC 3339 con zona.' }
        memberships:
          type: array
          description: Solo membresías activas (ADR 0011).
          items: { $ref: '#/components/schemas/MembershipSummary' }
    LoginMfaRequired:
      type: object
      description: El usuario tiene TOTP confirmado. No trae tokens de acceso; el challengeToken se canjea en POST /v1/auth/mfa/verify (#25).
      required: [status, challengeToken, expiresAt]
      properties:
        status: { type: string, const: mfa_required }
        challengeToken: { type: string, pattern: '^wk_ch_[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time, description: Vencimiento del challengeToken (5 min). }
    MembershipSummary:
      type: object
      description: Una membresía activa del usuario (la forma la fija el comentario de #27; la usan el login, el confirm de #25 y GET /v1/me/memberships).
      required: [membershipId, tenant, role, selectable, readOnly, sites]
      properties:
        membershipId: { type: string, format: uuid }
        tenant:
          type: object
          required: [id, name, industry, status]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, description: 'Nombre comercial o, si falta, la razón social; vacío hasta que #31 la complete.' }
            industry: { type: string, description: 'Enum abierto; vacío hasta que #31 lo complete.' }
            status: { type: string, description: 'Enum abierto: trial, activa, suspendida, cerrada.' }
        role:
          type: object
          required: [id, name, requiresMfa]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            requiresMfa: { type: boolean }
        selectable: { type: boolean, description: Falso si la empresa está suspendida. }
        blockedReason: { type: string, description: 'Solo con selectable falso. Enum abierto: tenant_suspended.' }
        readOnly: { type: boolean, description: Verdadero si la empresa está cerrada. }
        sites:
          type: array
          description: Solo sedes y cajas activas dentro del alcance de la membresía.
          items:
            type: object
            required: [id, name, cashRegisters]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              cashRegisters:
                type: array
                items:
                  type: object
                  required: [id, code]
                  properties:
                    id: { type: string, format: uuid }
                    code: { type: string }
    MfaEnrollmentRequired:
      type: object
      description: |
        Variante del 200 de POST /v1/auth/login (forma completa del login: #24) cuando el usuario no
        tiene TOTP y algún rol de sus membresías lo exige. No trae tokens de acceso. emailCodeSent es
        false si el Mailer no respondió o no había cupo de envío: el token sirve igual y el usuario
        pide un reenvío (conventions.md §2). En vez de esta variante, el login responde 429
        rate_limited con el segundo paso bloqueado o los topes de correo superados (10 por hora, 20
        en 24 h), y 401 invalid_credentials con el segundo paso cerrado tras 3 bloqueos.
      required: [status, enrollmentToken, expiresAt, emailCodeSent]
      properties:
        status: { type: string, const: mfa_enrollment_required }
        enrollmentToken: { $ref: '#/components/schemas/EnrollmentToken' }
        expiresAt: { type: string, format: date-time, description: Vencimiento del token y del emailCode. }
        emailCodeSent: { type: boolean }
    MfaEnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required: [enrollmentToken]
      properties:
        enrollmentToken: { $ref: '#/components/schemas/EnrollmentToken' }
    MfaTotpSecret:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: 'Secreto TOTP en base32, para escribirlo a mano.' }
        otpauthUri: { type: string, description: 'URI otpauth://totp/... que el BFF convierte en QR.' }
    MfaEnrollmentConfirmRequest:
      type: object
      additionalProperties: false
      required: [enrollmentToken, code, emailCode]
      properties:
        enrollmentToken: { $ref: '#/components/schemas/EnrollmentToken' }
        code: { $ref: '#/components/schemas/TotpCode' }
        emailCode: { $ref: '#/components/schemas/EmailCode' }
    MfaEnrollmentConfirmed:
      type: object
      description: Misma sesión sin empresa que el login con 2FA (secuencia 01); el BFF pone las cookies y lleva a /seleccionar-empresa.
      required: [accessToken, refreshToken, expiresAt, recoveryCodes, memberships]
      properties:
        accessToken: { type: string, pattern: '^wk_at_[A-Za-z0-9_-]{43}$' }
        refreshToken: { type: string, pattern: '^wk_rt_[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time, description: Vencimiento del accessToken. }
        recoveryCodes:
          type: array
          description: Los 10 códigos de recuperación; se muestran esta única vez (ADR 0004).
          minItems: 10
          maxItems: 10
          items: { type: string }
        memberships:
          type: array
          description: Misma forma que GET /v1/me/memberships.
          items: { $ref: '#/components/schemas/MembershipSummary' }
    MfaEmailCodeResent:
      type: object
      required: [resendAvailableAt, sendsRemaining]
      properties:
        resendAvailableAt: { type: string, format: date-time, description: Desde cuándo se puede pedir otro envío (60 s después de este). }
        sendsRemaining: { type: integer, minimum: 0, maximum: 2, description: Envíos que le quedan a este token. }
    Entitlements:
      type: object
      description: |
        Lo que la empresa tiene habilitado (paquete `internal/platform/entitlements`). `modules` y `flags`
        van ordenados y vacíos si la suscripción no es activa ni trial (cierra en falla), salvo en la empresa cerrada (`readOnly`), que conserva los de su último plan con sus overrides aunque la suscripción esté caída (ADR 0005, «Empresa cerrada»). `limits` trae los
        topes del plan; todo plan declara todas las claves (CHECK en `platform.plans`) y viene vacío sin plan.
        Una clave ausente es tope 0, nunca «sin tope»: la falta de dato cierra. No hay topes ilimitados; un
        plan holgado declara un número alto. `usage` es el uso del mes de Lima.
        `version` identifica el contenido sin el uso: sirve de ETag.
      required: [modules, flags, limits, usage, status, readOnly, version]
      properties:
        modules: { type: array, items: { type: string, examples: ['ventas', 'rubro.lubricentro'] } }
        flags: { type: array, items: { type: string } }
        limits:
          type: object
          description: 'Claves actuales: users, sites, cpe_per_month.'
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        usage:
          type: object
          description: 'Claves actuales: users, cpe_per_month.'
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [trial, activa, morosa, suspendida, cancelada, sin_plan] }
        readOnly: { type: boolean, description: 'true si la empresa está cerrada: todo método distinto de GET y HEAD da 403 tenant_read_only.' }
        version: { type: string, pattern: '^[0-9a-f]{16}$' }
